# Copy into a private Organization controller repository.
# Review and pin every uses: line to a full commit SHA before production.
#
# Required secrets:
#   TECHDEBTTER_APP_ID
#   TECHDEBTTER_APP_PRIVATE_KEY
#   TECHDEBTTER_APP_INSTALLATION_ID
#
# Required variables:
#   TECHDEBTTER_ORGANIZATION
#
# Optional variables:
#   TECHDEBTTER_ENABLE_REMEDIATION  set to "true" to run remediate + observe
#   (Organization Policy must also set defaults.remediation.enabled: true)
#
name: TechDebtter Controller

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional single repository name to analyze
        required: false
        type: string

concurrency:
  group: techdebtter-controller
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Discover repositories
        id: discover
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: discover
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          include-repositories: ${{ inputs.repository }}
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}

  analyze:
    needs: discover
    if: needs.discover.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Mint contents-read token
        id: app-token
        uses: actions/create-github-app-token@67018539274d865e18ab151a3b97ff9780bfd8d0 # v2
        with:
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: read

      - name: Checkout target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Analyze repository
        id: analyze
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: analyze
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          repository: ${{ matrix.repository }}
          path: .
          report-path: techdebtter-report.json
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}

      - name: Upload analysis report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ matrix.owner }}-${{ matrix.name }}
          path: techdebtter-report.json
          retention-days: 7

  publish:
    needs: [discover, analyze]
    if: needs.discover.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Download analysis report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report-${{ matrix.owner }}-${{ matrix.name }}

      - name: Publish eligible findings
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: publish
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          repository: ${{ matrix.repository }}
          report-path: techdebtter-report.json
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}

  verify:
    needs: [discover, analyze]
    if: needs.discover.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Download analysis report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report-${{ matrix.owner }}-${{ matrix.name }}

      - name: Verify remediated Finding Issues
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: verify
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          repository: ${{ matrix.repository }}
          report-path: techdebtter-report.json
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}

  remediate:
    needs: [discover, analyze, publish]
    if: >
      needs.discover.outputs.matrix != '' &&
      vars.TECHDEBTTER_ENABLE_REMEDIATION == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Mint contents-read token
        id: app-token
        uses: actions/create-github-app-token@67018539274d865e18ab151a3b97ff9780bfd8d0 # v2
        with:
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: read

      - name: Checkout target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Download analysis report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report-${{ matrix.owner }}-${{ matrix.name }}

      - name: Remediate highest-Criticality eligible Finding
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: remediate
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          repository: ${{ matrix.repository }}
          path: .
          report-path: techdebtter-report.json
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}

  observe:
    needs: [discover]
    if: >
      needs.discover.outputs.matrix != '' &&
      vars.TECHDEBTTER_ENABLE_REMEDIATION == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Observe open remediation draft PRs
        uses: derek-palmer/techdebtter@a67e93ab754844f74b6d6db165bd416692388388
        with:
          phase: observe
          organization: ${{ vars.TECHDEBTTER_ORGANIZATION }}
          repository: ${{ matrix.repository }}
          app-id: ${{ secrets.TECHDEBTTER_APP_ID }}
          installation-id: ${{ secrets.TECHDEBTTER_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.TECHDEBTTER_APP_PRIVATE_KEY }}
