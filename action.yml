name: TechDebtter
description: Analyze repositories and publish selected Finding Issues as a Bot Identity
author: TechDebtter

inputs:
  phase:
    description: Bot phase to run (discover | analyze | publish | remediate)
    required: true
  organization:
    description: Runtime-selected GitHub Organization
    required: true
  path:
    description: Local repository checkout path for analyze/remediate
    required: false
    default: "."
  report-path:
    description: Analysis report JSON path (analyze writes; publish/remediate read)
    required: false
    default: techdebtter-report.json
  repository:
    description: Optional owner/name for a single-repository matrix entry
    required: false
  include-repositories:
    description: Optional comma-separated repository names to include during discover
    required: false
  selection-id:
    description: Finding selection ID for the remediate phase
    required: false
  base-branch:
    description: Pull request base branch for remediate
    required: false
    default: main
  app-id:
    description: GitHub App ID used to mint phase-scoped installation tokens
    required: false
  installation-id:
    description: GitHub App installation ID for the Organization
    required: false
  private-key:
    description: GitHub App private key (PEM). Prefer repository secrets.
    required: false
  token:
    description: Optional pre-minted installation token (skips App auth)
    required: false

outputs:
  matrix:
    description: Discover JSON matrix of repositories
  repository-count:
    description: Discover repository count
  report-path:
    description: Analyze report path
  finding-count:
    description: Analyze finding count
  reproducible:
    description: Whether the analysis report is reproducible
  policy-verified:
    description: Whether Organization Policy was verified
  selected-count:
    description: Publish selected finding count
  published-count:
    description: Publish reconciled issue count
  result:
    description: PublicationResult or RemediationResult JSON
  status:
    description: Remediate status
  pull-request-number:
    description: Remediate draft PR number
  pull-request-url:
    description: Remediate draft PR URL
  draft:
    description: Whether the remediation PR remains draft

runs:
  using: node24
  main: dist/action/main.js

branding:
  icon: shield
  color: gray-dark
